[build]
  publish = "."

# Poster QR code target. This is a rewrite (200), not a redirect, on purpose:
# Cloudflare Web Analytics groups by path and does not log query strings, so
# /poster has to be a real path to show up as its own row. A 301/302 here would
# leave nothing for the beacon to record.
#
# Netlify normalises trailing slashes when matching, so this rule also serves
# /poster/. That is why every asset reference in index.html is root-relative:
# under /poster/ a relative path would resolve to /poster/images/... and 404.
[[redirects]]
  from = "/poster"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML always revalidates so a deploy is picked up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted/stable assets can be cached hard
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
