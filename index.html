<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Superlocal Studio — handmade furniture, San Francisco</title>
<meta name="description" content="Superlocal Studio makes furniture by hand in San Francisco. Platform beds, benches, and commissions built to order." />
<meta name="theme-color" content="#284871" />

<meta property="og:title" content="Superlocal Studio" />
<meta property="og:description" content="Handmade furniture, built to order in San Francisco." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://superlocal.studio/" />
<meta property="og:image" content="https://superlocal.studio/images/portfolio/shell-1200.jpg" />
<meta name="twitter:card" content="summary_large_image" />

<!-- Same document is served at / and /poster; point search engines at / -->
<link rel="canonical" href="https://superlocal.studio/" />

<link rel="preload" href="/fonts/Grenze-Italic.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/style.css?v=3" />
</head>
<body>

<canvas id="clouds" aria-hidden="true"></canvas>
<canvas id="reveal" aria-hidden="true"></canvas>

<div class="site">
  <section class="hero">
    <h1 class="vh">Superlocal Studio</h1>
  </section>

  <div class="wrap">
    <div class="section-k"><span>selected work</span><span>2026</span></div>

    <div class="gallery">
      <figure class="piece feature">
        <img src="/images/portfolio/shell-1200.jpg"
             srcset="/images/portfolio/shell-1200.jpg 1200w, /images/portfolio/shell-2000.jpg 2000w"
             sizes="(max-width: 720px) 100vw, 1116px"
             width="1200" height="900" loading="eager" decoding="async"
             alt="Solid pine platform bed in a bay-window bedroom" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/hem-700.jpg"
             srcset="/images/portfolio/hem-700.jpg 700w, /images/portfolio/hem-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="485" loading="lazy" decoding="async"
             alt="Platform bed with headboard on a tiled rug" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/platform-bed-700.jpg"
             srcset="/images/portfolio/platform-bed-700.jpg 700w, /images/portfolio/platform-bed-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="525" loading="lazy" decoding="async"
             alt="Low hardwood platform bed" />
      </figure>
      <figure class="piece feature">
        <img src="/images/portfolio/bed-frame-1200.jpg"
             srcset="/images/portfolio/bed-frame-1200.jpg 1200w, /images/portfolio/bed-frame-2000.jpg 2000w"
             sizes="(max-width: 720px) 100vw, 1116px"
             width="1200" height="900" loading="lazy" decoding="async"
             alt="Bed frame with a small bedside shelf beneath a window" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/bench-700.jpg"
             srcset="/images/portfolio/bench-700.jpg 700w, /images/portfolio/bench-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="525" loading="lazy" decoding="async"
             alt="Pine bench in a living room" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/in-progress-700.jpg"
             srcset="/images/portfolio/in-progress-700.jpg 700w, /images/portfolio/in-progress-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="525" loading="lazy" decoding="async"
             alt="Bed frame under construction in the workshop" />
      </figure>
      <figure class="piece feature">
        <img src="/images/portfolio/shelving-1200.jpg"
             srcset="/images/portfolio/shelving-1200.jpg 1200w, /images/portfolio/shelving-2000.jpg 2000w"
             sizes="(max-width: 720px) 100vw, 1116px"
             width="1200" height="900" loading="lazy" decoding="async"
             alt="Three-tier fir shelving unit with plywood shelves and exposed joinery" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/oak-bed-700.jpg"
             srcset="/images/portfolio/oak-bed-700.jpg 700w, /images/portfolio/oak-bed-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="525" loading="lazy" decoding="async"
             alt="Oak platform bed frame with slats in an empty bedroom" />
      </figure>
      <figure class="piece">
        <img src="/images/portfolio/stool-700.jpg"
             srcset="/images/portfolio/stool-700.jpg 700w, /images/portfolio/stool-1300.jpg 1300w"
             sizes="(max-width: 720px) 100vw, 550px"
             width="700" height="525" loading="lazy" decoding="async"
             alt="Small oak step stool with splayed legs" />
      </figure>
    </div>

    <div class="contact">
      <div class="l">get in touch</div>
      <div class="r">
        <p>Have a piece in mind? Send a note with dimensions, materials, and timeline &mdash; everything is built by hand, to order.</p>

        <form class="inquiry" name="inquiry" method="POST" action="/"
              data-netlify="true" data-netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="inquiry" />
          <p class="hp" aria-hidden="true">
            <label>Leave this field empty <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
          </p>

          <div class="field">
            <label for="f-name">name</label>
            <input id="f-name" name="name" type="text" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="f-email">email</label>
            <input id="f-email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="f-message">what are you thinking?</label>
            <textarea id="f-message" name="message" rows="5" required
                      placeholder="A bed frame for a queen mattress, white oak if possible &mdash; no rush on timing."></textarea>
          </div>

          <div class="actions">
            <button type="submit">send inquiry</button>
            <p class="status" role="status" aria-live="polite"></p>
          </div>
        </form>

        <p class="alt">Or email directly &mdash; <a href="mailto:jack@superlocal.studio">jack@superlocal.studio</a></p>
      </div>
    </div>

    <div class="foot">
      <span>&copy; 2026 Superlocal Studio</span>
      <span>San Francisco, CA</span>
    </div>
  </div>
</div>

<script src="/main.js?v=3"></script>

</html>
